aid: madeiramadeira
name: Madeiramadeira
description: >-
  MadeiraMadeira (MadeiraMadeira Comercio Eletronico S/A, Curitiba, Parana) is one of Brazil's largest
  online retailers and marketplaces for home goods - furniture, decor, appliances, building materials,
  bathroom and kitchen fixtures, and planned furniture - selling direct and through a third-party seller
  marketplace. Its developer surface is the seller-facing Marketplace MadeiraMadeira API: a versioned
  REST API over HTTPS at marketplace.madeiramadeira.com.br with a matching sandbox host, authenticated
  with a seller-bound TOKENMM header token issued in the Portal Marketplace. It covers product catalog
  submission and enrichment lifecycle, the category tree, price, stock and status updates, shipping
  (frete) tables plus a seller-hosted shipping-quote callback, the full order lifecycle from new through
  invoiced, shipped and delivered, financial ledger entries, and a JWT-authenticated Mensageria surface
  for buyer-seller messaging, attachments and tracking updates. Order and product events are delivered
  to seller-registered callback URLs.
