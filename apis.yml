apis:
- aid: madeiramadeira:marketplace
  name: Marketplace MadeiraMadeira API
  description: >-
    Seller-facing REST API for the MadeiraMadeira marketplace. Sellers use it to submit and update their
    product catalog, read the category tree, push price, stock, status and shipping-table changes, read
    and advance orders through the order lifecycle, query financial ledger entries, register callback
    URLs for order/product events and seller-hosted shipping quotes, and exchange messages with buyers
    through the Mensageria surface. Authentication is a seller-bound TOKENMM header token obtained from
    the Portal Marketplace (Administracao > Integracao); the Mensageria endpoints exchange it for a JWT.
  humanURL: https://documenter.getpostman.com/view/3341659/RztmqU19
  baseURL: https://marketplace.madeiramadeira.com.br
