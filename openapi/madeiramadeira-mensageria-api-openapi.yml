  /v1/mensageria/session/awaiting_answer_seller/count:
    get:
      operationId: msgAguardandoResposta
      summary: Msg aguardando resposta
      tags:
      - Mensageria
      x-postman-folder: Mensageria / Sessões
      description: 'Retorna a quantidade de mensagens aguardando resposta do vendedor.


        Autenticação: Bearer Token


        Query Parameters: Nenhum


        Response:


        count: Número inteiro de sessões com status "Awaiting Answer - Seller"


        Exemplo de Resposta:


        {

        "count": 42

        }


        Uso Comum:


        Exibir badge de notificação no painel


        Alertar sobre sessões pendentes de resposta


        Monitorar workload do vendedor


        Status HTTP:


        200: Contagem obtida com sucesso


        401: Token inválido'
      responses:
        '200':
          description: Success
        '400':
          description: Erro no JSON enviado (verificar estrutura e enviar novamente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ausencia de um dos tokens no header ou token nao existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Token revogado ou invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno de servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerJWT: []
  /v1/mensageria/message:
    post:
      operationId: enviarMensagem
      summary: Enviar mensagem
      tags:
      - Mensageria
      x-postman-folder: Mensageria / Mensagens
      description: 'Envia uma mensagem em uma sessão existente.


        Autenticação: Bearer Token


        Headers:

        MMTOKEN: Token MM fornecido no portal marketplace


        Payload:


        session_id (integer, obrigatório): ID da sessão


        text (string, obrigatório): Conteúdo da mensagem (máximo 5000 caracteres)


        type (string, obrigatório): Tipo da mensagem


        text: Mensagem de texto


        image: Imagem (JPEG, PNG até 5mb)


        received_at (ISO 8601 datetime, opcional): Data/hora da mensagem


        Regras de Negócio:


        A sessão deve existir e estar aberta


        Não é permitido enviar mensagens em sessões finalizadas ou em mediação


        Mensagens são armazenadas no banco de dados


        Máximo 5000 caracteres por mensagem


        Response:


        message: Indicação de que a mensagem foi enviada com sucesso.


        Exemplo de Payload:


        {

        "session_id": 789012,

        "text": "Olá! Qual é o status do meu pedido?",

        "type": "text",

        "received_at": "2024-01-15T10:35:00Z"

        }


        Exemplo de Response


        {

        "message": "Mensagem encaminhada com sucesso"

        }


        Status HTTP:


        200: Mensagem enviada com sucesso


        400: Validação falhou


        404: Sessão não encontrada


        409: Sessão não permite mais mensagens


        401: Token inválido


        500: Erro ao enviar para Lambda'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              session_id: 123456
              text: Sua mensagem aqui
              type: text
              received_at: 1787706288
      responses:
        '200':
          description: Success
        '400':
          description: Erro no JSON enviado (verificar estrutura e enviar novamente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ausencia de um dos tokens no header ou token nao existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Token revogado ou invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno de servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerJWT: []
  /v1/mensageria/orders/historic:
    get:
      operationId: mensagensPorOrderId
      summary: Mensagens por order_id
      tags:
      - Mensageria
      x-postman-folder: Mensageria / Mensagens
      description: 'GET /orders/historic


        Retorna o histórico de sessões (conversas) associadas a um ou mais pedidos.


        As sessões são agrupadas por pedido e data de criação.


        Autenticação


        Bearer Token


        Authorization: Bearer {token}


        Header adicional obrigatório:


        MMTOKEN: {marketplace-token}


        Endpoint


        GET /api/v1/orders/historic


        Exemplo:


        GET /api/v1/orders/historic?orders=56827504


        Query Parameters


        Parâmetro

        Tipo

        Obrigatório

        Descrição


        orders

        string

        Sim

        Lista de IDs de pedidos separados por vírgula


        Exemplo:


        orders=56827504,56827505


        Estrutura da Resposta


        A resposta é um objeto onde cada chave representa um order_id.


        Cada pedido contém:


        order_id

        └ sessions

        └ data

        └ array de sessões


        Campos da Sessão


        Campo

        Tipo

        Descrição


        session_id

        integer

        ID da sessão


        order_seller

        string

        Número do pedido do seller


        order

        string

        Número do pedido no marketplace


        order_hash

        string

        Hash do pedido


        child_order_hash

        string

        Hash do subpedido


        order_date

        string

        Data do pedido


        created_at

        string

        Data de criação da sessão


        expired_date

        string

        Data de expiração da sessão


        version

        integer

        Versão da sessão


        csat_id

        string

        ID do CSAT associado


        Objeto Status


        Campo

        Tipo

        Descrição


        id

        integer

        ID do status


        description

        string

        Descrição do status


        slug

        string

        Identificador do status


        Objeto Reason


        Campo

        Tipo

        Descrição


        id

        integer

        ID interno do motivo


        external_id

        integer

        ID externo


        description

        string

        Descrição do motivo


        type

        string

        Tipo do motivo


        category

        string

        Categoria do motivo


        is_central_atendimento

        boolean

        Indica se é da central de atendimento


