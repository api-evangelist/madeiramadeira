openapi: 3.2.0
info:
  title: MadeiraMadeira Marketplace Mensageria API
  version: v1
  summary: Seller-facing marketplace API for products, categories, stock, price, shipping tables, orders, financial entries and seller-buyer messaging.
  description: 'Introdução


    Bem-vindo ao Marketplace MadeiraMadeira!'
  contact:
    name: MadeiraMadeira Marketplace
    url: https://www.madeiramadeira.com.br/marketplace
  x-derived-from: Public Postman collection "Marketplace MadeiraMadeira" published by MadeiraMadeira (documenter.getpostman.com/view/3341659/RztmqU19)
servers:
- url: https://marketplace.madeiramadeira.com.br
  description: Producao (production)
- url: https://marketplace-sandbox.madeiramadeira.com.br
  description: Sandbox
security:
- TOKENMM: []
tags:
- name: Mensageria
paths:
  /v1/mensageria/auth/generate-token:
    post:
      operationId: gerarToken
      summary: Gerar token
      tags:
      - Mensageria
      x-postman-folder: Mensageria / Autenticação
      description: 'Gera um token JWT através do Keycloak usando o MMTOKEN (token do portal marketplace).


        Autenticação: MMTOKEN (Header)


        Fluxo:


        Envia o MMTOKEN no header


        Sistema chama Millennium Falcon para gerar JWT via Keycloak


        Retorna o token JWT que será utilizado nas próximas requisições


        Response:


        access_token: Token JWT a ser usado nas requisições subsequentes


        token_type: Tipo do token (geralmente "Bearer")


        expires_in: Tempo de expiração do token em segundos


        Variáveis de Ambiente:


        {{base_url}}: URL base da API (ex: https://marketplace.madeiramadeira.com.br)


        {{mm_token}}: Token do portal marketplace (MMTOKEN)'
      responses:
        '200':
          description: Generate Token - Success
          content:
            application/json:
              example:
                data:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  token_type: Bearer
                  expires_in: 3600
        '401':
          description: Generate Token - Unauthorized
          content:
            application/json:
              example:
                error: Token não encontrado no contexto
        '400':
          description: Erro no JSON enviado (verificar estrutura e enviar novamente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Token revogado ou invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno de servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - TOKENMM: []
  /v1/mensageria/auth/revoke-token:
    post:
      operationId: revogarToken
      summary: Revogar token
      tags:
      - Mensageria
      x-postman-folder: Mensageria / Autenticação
      description: 'Revoga um token JWT.


        Autenticação: MMTOKEN (Header)


        Payload:


        token (string, obrigatório): O token JWT a ser revogado


        Response:


        Retorna status 200 se a revogação foi bem-sucedida


        Exemplo de Uso:


        Quando o usuário faz logout


        Para invalidar tokens antigos ou de segurança


        Após operações sensíveis que requerem re-autenticação'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              token: '{{token_mensageria}}'
      responses:
        '200':
          description: Revoke Token - Success
          content:
            application/json:
              example:
                message: Token revogado com sucesso
        '400':
          description: Erro no JSON enviado (verificar estrutura e enviar novamente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ausencia de um dos tokens no header ou token nao existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Token revogado ou invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno de servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - TOKENMM: []
  /v1/mensageria/session:
    post:
      operationId: criarSessao
      summary: Criar sessão
      tags:
      - Mensageria
      x-postman-folder: Mensageria / Sessões
      description: 'Cria uma nova sessão de atendimento.


        Autenticação: Bearer Token


        Payload:


        order_id (string, obrigatório): ID único do pedido


        reason_id (integer, obrigatório): ID externo do motivo da sessão


        subreason_id (integer, obrigatório quando o reason_id possui subreason)


        description (string, opcional): Descrição detalhada do problema


        Regras de Negócio:


        Não é permitido ter mais de uma sessão aberta por pedido


        Se já existe uma sessão aberta para este pedido, ela será retornada


        A sessão será criada com status "1 - Aguardando sua resposta"


        A sessão só pode ser aberta usando um dos seguintes reason_id e subreason_id


        206 - Insucesso de entrega


        410 - Aguardando retirada


        411 - Endereço errado


        412 - Cliente ausente


        208 - Confirmar dados entrega


        Exemplo de response:


        {

        "data": {

        "session_id": 905,

        "order_seller": "9346321",

        "order": "72021270",

        "order_hash": "69668d66ff2789b9ea1a3792",

        "child_order_hash": "69668d66ff2789b9ea1a3791",

        "order_date": "2026-01-13 12:22:38",

        "customer_name": "Vinicius Da Rocha Gomes",

        "status": {

        "id": 1,

        "description": "Aguardando Resposta",

        "slug": "awaiting_answer_seller"

        },

        "created_at": "2026-01-14 14:08:13",

        "expired_date": "",

        "reason": {

        "id": 410,

        "external_id": 22,

        "description": "Cancelamento de pedido/produto antes da entrega",

        "type": "Produto",

        "category": "Cancelar ou tirar dúvidas sobre cancelamento",

        "is_central_atendimento": true,

        "descricao_central_atendimento": "Cancelar produto que não foi entregue",

        "has_sub_reasons": false

        },

        "subreason_id": 186,

        "version": 2,

        "csat_id": ""

        },

        "new_session": false

        }


        data: Objeto da sessão criada


        session_id: ID da sessão gerada


        order: Número do pedido


        status: Status inicial da sessão


        reason: Motivo da sessão


        created_at: Data de criação


        new_session: Boolean indicando se é uma nova sessão ou se já existia


        Status HTTP:


        201: Sessão criada ou já existia


        400: Erro de validação


        401: Token inválido


        500: Erro interno do servidor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              order_id: '202412001'
              reason_id: 101
              description: Descrição detalhada do problema
      responses:
        '200':
          description: Success
        '400':
          description: Erro no JSON enviado (verificar estrutura e enviar novamente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ausencia de um dos tokens no header ou token nao existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Token revogado ou invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno de servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerJWT: []
  /v1/mensageria/seller/historic:
    get:
      operationId: historicoDeSessoes
      summary: Histórico de sessões
      tags:
      - Mensageria
      x-postman-folder: Mensageria / Sessões
      description: 'Retorna o histórico de sessões de um vendedor específico.


        Autenticação: Bearer Token


        Query Parameters:


        page (integer, opcional): Página para paginação


        limit (integer, opcional): Limite de registros


        status (integer, opcional): Filtrar por status:


        1 - Aguardando sua resposta


        2 - Aguardando o cliente


        3 - Finalizado


        4 - Mediado


        5 - Mediação finalizada


        6 - Atendimento com pendência


        Response:


        Array de sessões com mesmo formato de "Get Historic Sessions"


        Paginação incluída


        Exemplo de response:


        {

        "data": [

        {

        "session_id": 1122,

        "order_seller": "9346817",

        "order": "72022580",

        "order_hash": "698dea60ef4d942b87396d08",

        "child_order_hash": "698dea60ef4d942b87396d07",

        "order_date": "2026-02-12 08:57:59",

        "customer_name": "TESTE QA AZION",

        "status": {

        "id": 1,

        "description": "Aguardando Resposta",

        "slug": "awaiting_answer_seller"

        },

        "created_at": "2026-02-12 16:38:21",

        "expired_date": "2026-02-19 16:38:30",

        "reason": {

        "id": 590,

        "external_id": 211,

        "description": "Tirar dúvidas sobre cancelamento",

        "type": "Produto",

        "category": "Cancelar ou tirar dúvidas sobre cancelamento",

        "is_central_atendimento": true,

        "descricao_central_atendimento": "Tirar dúvidas sobre cancelamento",

        "has_sub_reasons": false

        },

        "version": 2,

        "csat_id": ""

        }

        ],

        "pagination": {

        "total_count": 519,

        "count": 1,

        "page": 1,

        "lines": 1

        }

        }


        Diferença do endpoint de Orders:


        Este é filtrado pelo vendedor autenticado


        Retorna apenas sessões do seu portfólio


        Mais eficiente para dashboards do seller


        Status HTTP:


        200: Histórico obtido com sucesso


        401: Token inválido'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: string
        example: '1'
      - name: limit
        in: query
        required: false
        schema:
          type: string
        example: '20'
      - name: status
        in: query
        required: false
        schema:
          type: string
        example: '2'
      responses:
        '200':
          description: Success
        '400':
          description: Erro no JSON enviado (verificar estrutura e enviar novamente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ausencia de um dos tokens no header ou token nao existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Token revogado ou invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno de servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - BearerJWT: []
  /v1/mensageria/session/123456:
    get:
      operationId: sessaoPorId
      summary: Sessão por ID
      tags:
      - Mensageria
      x-postman-folder: Mensageria / Sessões
      description: 'GET /session/{session_id}


        Retorna os detalhes de uma sessão específica pelo ID.


        Autenticação


        Bearer Token


        Authorization: Bearer {token}


        Parâmetros de Rota


        Parâmetro

        Tipo

        Obrigatório

        Descrição


        session_id

        integer

        Sim

        ID único da sessão


        Exemplo:


        GET /session/123456


        Estrutura da Resposta


        Campo

        Tipo

        Descrição


        id

        integer

        ID único da sessão


        source

        string

        Origem da sessão


        order_id

        string

        Número do pedido no marketplace


        order_hash

        string

        Hash do pedido


        child_order_hash

        string

        Hash do subpedido


        reason_id

        integer

        ID do motivo da sessão


        order_seller

        string

        Número do pedido do seller


        status_id

        integer

        ID do status da sessão


        seller_id

        integer

        ID interno do seller


        buyer_id

        integer

        ID interno do comprador


        last_contact

        integer

        Timestamp do último contato (Unix em milissegundos)


        last_contact_role

        string

        Papel do último contato (buyer, seller, attendant)


        order_date

        string (ISO 8601)

        Data do pedido


        csat_id

        string

        ID do CSAT associado


        expired_date

        string

        Data de expiração da sessão


        version

        integer

        Versão da sessão


        created_at

        string (ISO 8601)

        Data de criação


        updated_at

        string (ISO 8601)

        Data da última atualização


        Objetos Aninhados


        Status


        Informações do status atual da sessão.


        Campo

        Tipo

        Descrição


        id

        integer

        ID do status


        description

        string

        Descrição do status


        slug

        string

        Identificador do status


        created_at

        string

        Data de criação


        updated_at

        string

        Data de atualização


        Seller


        Informações do vendedor.


        Campo

        Tipo

        Descrição


        id

        integer

        ID interno


        external_id

        string

        ID externo do seller


        name

        string

        Nome do seller


        email

        string

        Email do seller


        role

        string

        Role do usuário


        document

        string

        Documento do seller


        phone

        string

        null


        api_version

        integer

        Versão da API


        created_at

        string

        Data de criação


        updated_at

        string

        Data de atualização


        Buyer


        Informações do comprador.


        Campo

        Tipo

        Descrição


        id

        integer

        ID interno


        external_id

        string

        ID externo


        name

        string

        Nome


        email

        string

        Email


        role

        string

        Role do usuário


        phone

        string

        null


        created_at

        string

        Data de criação


        updated_at

        string

        Data de atualização


        Attendant


        Informações do atendente da sessão.


        Campo

        Tipo

        Descrição


        id

        integer

        ID interno


        external_id

        string

        ID externo


        name

        string

        Nome


        email

        string

        Email


        role

        string

        Role


        phone

        string

        null


        created_at

        string

        Data de criação


        updated_at

        string

        Data de atualização


        Reason


        Motivo da abertura da sessão.


        Campo

        Tipo

        Descrição


        id

        integer

        ID interno do motivo


        external_id

        integer

        ID externo do motivo


        description

        string

        Descrição


        is_firstcall

        boolean

        Indica se é first call


        is_central_atendimento

        boolean

        Indica se é central de atendimento


        visible_seller

        boolean

        Visível para seller


        visible_customer

        boolean

        Visível para cliente


        created_at

        string

