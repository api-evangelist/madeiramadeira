        updated_at

        string

        Data de atualização


        Exemplo de Resposta


        {

        "id": 123456,

        "source": "app",

        "order_id": "56827504",

        "order_hash": "67ae0fb0b73bc1d31f0f8eec",

        "child_order_hash": "67ae0fb0b73bc1d31f0f8eeb",

        "reason_id": 567,

        "order_seller": "8328522",

        "status_id": 3,

        "seller_id": 8,

        "buyer_id": 23362,

        "last_contact": 1769716344961,

        "last_contact_role": "seller",

        "order_date": "2025-02-13T09:28:58-03:00",

        "csat_id": "327808",

        "expired_date": "",

        "version": 2,

        "created_at": "2026-01-29T16:52:24-03:00",

        "updated_at": "2026-02-02T13:55:27-03:00",

        "Status": {},

        "Seller": {},

        "Buyer": {},

        "Attendant": {},

        "Reason": {}

        }'
      responses:
        '200':
          description: Get Session - Success
          content:
            application/json:
              example:
                data:
                  session_id: 123456
                  order: '202412001'
                  order_seller: MM123456
                  order_date: '2024-01-15T10:30:00Z'
                  customer_name: João Silva
                  status:
                    id: 2
                    description: Awaiting Answer - Seller
                  reason:
                    id: 1
                    external_id: 101
                    description: Dúvidas sobre Entrega
                  expired_date: '2024-01-20T10:30:00Z'
                  created_at: '2024-01-15T10:30:00Z'
        '400':
          description: Erro no JSON enviado (verificar estrutura e enviar novamente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Ausencia de um dos tokens no header ou token nao existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Token revogado ou invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erro interno de servidor
          content:
            application/json:
              schema:
