      description: 'Notifica ao marketplace que uma lista de pedidos tiveram Nota Fiscal (NF) emitida pelo Seller


        O pedido deve estar no status 3 (APROVADO) para receber atualização de notificação de nota fiscal emitida


        A data de emissão da Nota Fiscal (NF) não pode ser anterior a data de aprovação do pedido


        A quantidade máxima de caracteres da Nota Fiscal (NF) é de 44 dígitos


        O pedido com mais de um item e mais de uma quantidade precisa colocar o subtotal dos itens e repetir a mesma chave de nota fiscal se for uma única nota


        Importante que o valor enviado por SKU seja o valor total dos Produtos, caso contrário o status do pedido não será alterado'
