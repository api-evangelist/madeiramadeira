                    valor: Antes de utilizar o produto, remover as eventuais etiquetas e lavar com água quente e detergente. Use uma fonte de calor brando para evitar que o alimento grude no fundo do caldeirão. O fundo triplo distribui uniformemente o calor, não sendo necessário o fogo alto. E, além disso, você economiza energia. Quando o caldeirão for utilizado no fogão a gás, a chama não deve ultrapassar a base do caldeirão. No caso de uso de chapa elétrica, a chapa deverá ter diâmetro igual ou inferior ao do caldeirão. Sempre dissolva o sal em água fervendo ou com os alimentos, mexendo os ingredientes no início do cozimento. Não aqueça o alimento colocando um caldeirão do mesmo diâmetro sobre o outro. Esse procedimento é perigoso, pois cria vácuo e impossibilita a retirada do mesmo. Se a tampa do caldeirão de aço inox Tramontina ficar presa pelo efeito do vácuo durante o resfriamento, basta puxar ou aquecer novamente até neutralizar o efeito do vácuo. As alças aquecem durante o cozimento. Aconselhamos o uso de luvas durante o manuseio. Alguns alimentos que possuem amido, como massa e arroz, poderão deixar manchas na parte interna do caldeirão durante o cozimento. Para remover facilmente as manchas, passe um pano umedecido com suco de limão ou vinagre, ou use a Pasta para Polir e Remover Manchas Tramontina. Evite deixar alimento no caldeirão por muito tempo; o sal também pode provocar manchas. Para que o caldeirão de aço inox fique sempre bonito e com brilho, recomendamos que seja lavado somente com detergente e esponja. A Tramontina desenvolveu uma pasta especial para polir e remover manchas nos produtos de aço inoxidável, que está disponível nos principais pontos de venda. Depois da lavagem, sempre que possível, enxágue o caldeirão com água quente e seque-a imediatamente, para que ela mantenha o brilho original, pois o cloro e as substâncias contidas na água podem deixar manchas no caldeirão. Não deixe o caldeirão vazio sobre uma fonte de calor. Deixe caldeirões quentes somente em superfícies resistentes ao calor.
