                  - nome: Informações Técnicas
                    valor: '- Base plástica:A madeira é fixada em uma base plástica de polietileno de alta densidade (PEAD), com proteção anti-uv, (proteção contra raios ultra-violetas), alta resistência a impacto, possui um grande sistema de encaixe lateral entre as placas que permite a flexibilidade e rapidez na montagem.

                      - Madeira fixada na base plástica com parafusos chipboard 3,5 x 20

                      - Madeira lixada e boleada

                      - Alta resistência e durabilidade

                      - Dispensa mão de obra especializada

                      - Pode ser montada e desmontada quando quiser facilmente

                      - Suporta até 400 Kg estático

                      - Altamente flexível

                      - Antes de começar a instalação do DECK PRATICO, meça a área a ser coberta calculando quantas placas serão necessárias, lembrando que cada placa mede 30x30cm.Caso não tenha gostado da posição que fixou seu DECK PRATICO, basta desmontar e montar novamente elevando-o de baixo para cima e pressionando no sentido contrário. Desta forma, as placas se desencaixarão permitindo nova paginação. Isso proporciona a possibilidade de mudar os decks de posição caso tenha se cansado do desenho inicial.

                      - Instalando o DECK PRATICO : Basta fazer o alinhamento entre as placas, pressionando seus encaixes plásticos laterais um contra o outro. A operação não precisa de qualquer material adesivo, parafuso ou areia. O DECK PRATICO fica firme sem qualquer tipo de cimento ou estrutura de fixação. Caso necessário, o DECK PRATICO é facilmente modelável, podendo ser serrado no formato desejado para adaptação ao ambiente (pilares, formas não lineares de terreno, entre outros).

                      - Como se dá a instalação: As placas podem ser instaladas com até 5 mm de discrepância de altura entre elas. Porém, buracos ou outras cavidades podem necessitar de reparos ou ajustes, principalmente se houver rachaduras ou grandes desníveis naturais do terreno a ser instalado o DECK PRATICO.'
