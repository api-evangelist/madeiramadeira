                    valor: Antes de utilizar o produto, remover as eventuais etiquetas e lavar com água quente e detergente. Use uma fonte de calor brando para evitar que o alimento grude no fundo da caçarola. O fundo triplo distribui uniformemente o calor, não sendo necessário o fogo alto. E, além disso, você economiza energia. Quando a caçarola for utilizada no fogão a gás, a chama não deve ultrapassar a base da caçarola. No caso de uso de chapa elétrica, a chapa deverá ter diâmetro igual ou inferior ao da caçarola. Sempre dissolva o sal em água fervendo ou com os alimentos, mexendo os ingredientes no início do cozimento. Não aqueça o alimento colocando uma caçarola do mesmo diâmetro sobre a outra. Esse procedimento é perigoso, pois cria vácuo e impossibilita a retirada do mesma. Se a tampa da caçarola de aço inox Tramontina ficar presa pelo efeito do vácuo durante o resfriamento, basta puxar ou aquecer novamente até neutralizar o efeito do vácuo. O cabo de inox aquece durante o cozimento. Aconselhamos o uso de luvas durante o manuseio. Alguns alimentos que possuem amido, como massa e arroz, poderão deixar manchas na parte interna da panela durante o cozimento. Para remover facilmente as manchas, passe um pano umedecido com suco de limão ou vinagre, ou use a Pasta para Polir e Remover Manchas Tramontina. Evite deixar alimento na panela por muito tempo; o sal também pode provocar manchas. Para que a caçarola de aço inox fique sempre bonita e com brilho, recomendamos que seja lavada somente com detergente e esponja. A Tramontina desenvolveu uma pasta especial para polir e remover manchas nos produtos de aço inoxidável, que está disponível nos principais pontos de venda. Depois da lavagem, sempre que possível, enxágue a caçarola com água quente e seque-a imediatamente, para que ela mantenha o brilho original, pois o cloro e as substâncias contidas na água podem deixar manchas na caçarola. Pode ir ao forno em temperatura máxima de 260°C, podendo haver mudança na coloração. Não deixe a caçarola vazia sobre uma fonte de calor. Deixe panelas quentes somente em superfícies resistentes ao calor.
