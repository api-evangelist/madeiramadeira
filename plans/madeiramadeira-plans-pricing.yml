note: >-
  MadeiraMadeira publishes NO plans, tiers or price list for the Marketplace API, and plan_count is a
  measured 0 rather than an omission. The API is not a product that is sold - it is the integration
  channel for the marketplace, and access to it is a consequence of being an approved seller. The
  commercial model is stated on MadeiraMadeira's own seller page as "Sem custo inicial - Pague apenas
  comissao sobre as vendas" (no initial cost; pay only commission on sales), with no monthly fee and
  no subscription. The commission RATE is not published: MadeiraMadeira does not state a percentage,
  a category schedule, or a fee table on any public page of its own. Third-party integrator blogs
  circulate a 14-21% by-category range, but that is not a MadeiraMadeira-published figure and it is
  deliberately NOT recorded here as one.
