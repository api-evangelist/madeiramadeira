    stage: Aguardando enriquecimento
  - path: /v1/produto/aenriquecer/limit={limit}&offset={offset}
    operationId: buscaProdutosAguardandoEnriquecimentoComLimitEOffset
    stage: Aguardando enriquecimento
  - path: /v1/produto/enriquecendo/{sku}
    operationId: buscaUmProdutoQueEstaEmEnriquecimentoPeloSeuSku
    stage: Em enriquecimento
  - path: /v1/produto/enriquecendo/limit={limit}&offset={offset}
