api: madeiramadeira:marketplace
versioning:
  scheme: URI path prefix
  current_version: v1
  versions_published:
  - v1
  policy_published: false
  note: >-
    Every operation sits under /v1. MadeiraMadeira publishes no versioning policy - no statement of
    how a v2 would be introduced, how long v1 would be supported, or what constitutes a breaking
    change. There is no version header and no content negotiation.
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecations_announced: true
  note: >-
    There is no written deprecation POLICY, but MadeiraMadeira does announce deprecations in place in
    the reference, which is why a Deprecation pointer is wired. The announcement carries no date and
    no removal deadline - the published wording is "foram depreciados. Em breve, serao removidos da
    API" (deprecated; will soon be removed) - so an integrator cannot plan a migration against it.
    Neither RFC 8594 Sunset nor a Deprecation header is served.
  deprecated_operations:
