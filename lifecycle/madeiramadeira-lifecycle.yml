status_page:
  published: false
  probed:
  - url: https://status.madeiramadeira.com.br/
    result: does not resolve (DNS NXDOMAIN)
  note: >-
    No status page, uptime dashboard or incident history is published for the Marketplace API. The
    only availability instrument in the documentation runs the other way: MadeiraMadeira requires 85%
    availability and a 1500 ms maximum response time FROM the seller's own shipping-quote endpoint,
    measurable by the seller in the Seller Dashboard. MadeiraMadeira publishes no reciprocal
    commitment for its own API. No StatusPage pointer is wired as a result.
sla:
