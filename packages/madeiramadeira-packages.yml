summary: >-
  MadeiraMadeira publishes NO first-party client SDK for the Marketplace API in any public package
  registry. The organisation does publish first-party packages (npm scope-less mm-* loggers, the
  @cavilha design-system, and Composer packages under the madeiramadeirabr vendor), but every one of
  them is internal engineering tooling - loggers, an AWS Secrets Manager helper, an observer utility,
  a web-store theme - and none of them wraps the public Marketplace API. The only package that is a
  Marketplace API client is third-party, published by the Magazord e-commerce platform, and it has
  never cut a tagged release.
