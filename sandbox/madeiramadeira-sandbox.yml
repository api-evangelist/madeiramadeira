source: >-
  "Ambientes" section of the public Marketplace MadeiraMadeira Postman documentation
  (https://documenter.getpostman.com/view/3341659/RztmqU19), plus a live unauthenticated probe of the
  sandbox host on 2026-08-25.
api: madeiramadeira:marketplace
published: true
environments:
- name: Producao
  role: production
  base_url: https://marketplace.madeiramadeira.com.br
  live: true
  probe:
    url: https://marketplace.madeiramadeira.com.br/v1/categoria/limit=1&offset=0
    status: 401
    body: '{"meta":{"count":0},"errors":{"detail":"Token not found"}}'
