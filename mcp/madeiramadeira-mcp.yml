  - sessaoPorId
  - mensagensPorOrderId
  - msgAguardandoResposta
  read_only: true
  auth_note: Requires the Mensageria bearer JWT, not the TOKENMM header.
- name: send_buyer_message
  description: Send a message to a buyer in a session.
  rest:
  - enviarMensagem
  read_only: false
  destructive: false
  reversible: false
  reversal_note: No delete or recall operation is documented for a sent message.
agent_readiness_notes:
- >-
  An agent implementing these tools must not treat limit/offset as query parameters - they are literal
  path segments on this API. See conventions/madeiramadeira-conventions.yml.
- >-
  No write operation on this API is idempotent and only three have any documented reversal, so an
  agent must not blind-retry a timed-out write. Order status transitions in particular are a one-way
  ratchet that can only be corrected by contacting MadeiraMadeira.
- >-
  Errors carry no machine-readable code - only an HTTP status and a Portuguese prose detail string.
