candidate_tools:
- name: list_categories
  description: Read the MadeiraMadeira category tree to resolve the id_categoria a product must be filed under.
  rest:
  - consultaArvoreDeCategorias
  - consultaArvoreDeCategoriasPorNome
  read_only: true
- name: submit_products
  description: Submit one or more products to the catalog for analysis and publication.
  rest:
  - enviaUmOuMaisProdutos
  read_only: false
  destructive: false
- name: get_product
  description: Read a single product, or a list of products, by SKU.
  rest:
  - buscaUmProdutoPorSku
  - buscaProdutosPorUmaListaDeSku
  read_only: true
- name: list_products_by_state
  description: >-
    List products in a given pipeline state - pending, awaiting approval, rejected, divergent, in
    publication, not commercialised, or published.
  rest:
  - buscaTodosOsProdutosPendentes
  - buscaTodosOsProdutosPublicados
  - buscaProdutosPorSituacaoLimitEOffset
  read_only: true
- name: update_price
  description: Update the price of one or more SKUs.
  rest:
  - atualizaPrecoDeUmOuVariosSkus
  read_only: false
  destructive: true
  reversible: false
- name: update_stock
  description: Update available stock for one or more SKUs.
  rest:
  - atualizaEstoqueDeUmOuVariosSkus
  read_only: false
  destructive: true
  reversible: false
- name: update_status
  description: Activate (1) or deactivate (0) one or more SKUs.
  rest:
  - atualizaOStatusDeUmOuVariosSkus
  read_only: false
  destructive: true
  reversible: true
  reversal_note: Reversible only by issuing the opposite write; there is no undo operation.
- name: bulk_update_products
  description: Update price, stock, status, shipping table and shipping dimensions in a single call.
  rest:
  - atualizacaoEmMassaDePrecoEstoqueStatusETabelaDeFreteDimensoesDeFrete
  read_only: false
  destructive: true
  reversible: false
- name: delete_pending_product
  description: Remove a product that is still in the pending queue.
  rest:
  - apagaUmProdutoPendente
  read_only: false
  destructive: true
- name: list_orders
  description: List orders - all, by status, by date range, or only new ones.
  rest:
  - listaDeTodosOsPedidos
  - listaDePedidosPorStatus
  - listaTodosOsPedidosEntreDatas
  - novoConsultaListaDePedidosNovos
  read_only: true
- name: get_order
  description: Read a single order by id, with items, buyer, delivery, invoice and shipment detail.
  rest:
  - consultaPedidoPorId
  read_only: true
- name: advance_order_status
  description: >-
    Notify MadeiraMadeira that orders were received, invoiced, shipped or delivered. One-way - there
    is no reversal operation for any of these transitions.
  rest:
  - recebidoNotificaQueVariosPedidosForamRecebidos
  - nfEmitidaNotificaQueVariosPedidosTiveramNotaFiscalEmitida
  - enviadoNotificaQueVariosPedidosForamEnviados
  - entregueNotificaQueVariosPedidosForamEntregues
  read_only: false
  destructive: true
  reversible: false
- name: list_shipping_tables
  description: Read the seller's registered shipping-rate tables.
  rest:
  - consultaTabelaDeFreteDoSellerComLimitEOffset
  read_only: true
- name: manage_callbacks
  description: List, create and delete the seller's webhook callback URLs.
  rest:
  - consultaUrlsDeCallbackCadastradas
  - criaNovaUrlDeCallback
  - deletarUmCallback
  read_only: false
  destructive: true
  reversible: true
- name: list_financial_entries
  description: Read financial ledger entries (sales, commissions, withdrawals) for a date range.
  rest:
  - consultaLancamentoFinanceiroDeSaqueESeuDetalhamento
  read_only: true
- name: list_buyer_messages
  description: Read buyer-seller message sessions and their history.
  rest:
